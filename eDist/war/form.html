<script type="text/javascript">
	function test() {
		FormTester.theAnswer(function(data) {
			if (data != null && typeof data == 'object')
				alert(dwr.util.toDescriptiveString(data, 2));
			else
				dwr.util.setValue('d0', dwr.util.toDescriptiveString(data, 1));
		});
	}
</script>

<body>

	<div class="container-narrow">
		<div class="header">
			<ul class="nav nav-pills pull-right">
				<li class="active"><a href="#">Contato</a></li>
				<li><a href="#">Gestao</a></li>
			</ul>
			<h3 class="text-muted">Exército Brasileiro</h3>
		</div>

		<div class="row new">
			<div class="col-8">
				<img class="supimage" src="img/formtitle.cache.png"></img>
				<form action="" id="contact-form" class="form-horizontal">
					<fieldset>
						<div class="input-group">
							<span class="input-group-addon input-large">Id:</span> 
							<input type="text" class="form-control input-large" name="id" id="id"
								placeholder="Nick, id ou profile">
						</div>
						<div class="col-5">
						<div class="input-group">
						<span class="input-group-addon">FF:</span> 
							<input type="number" disabled class="form-control" name="quant" id="quant"
								min="10" max="100" value="10" step="10">
						</div>
						</div>
						<div class="col-7">
						<div class="input-group">
							<select class="selectpicker" disabled data-style="btn-inverse" name="type" id="type">
								<option value="weps">Armas</option>
								<option value="food">Comida</option>
								<option value="both">Ambos</option>
								<option data-divider="true"></option>
								<option value="rocket">Rocket</option>
							</select>
						</div>
						</div>
						
						
						<div class="form-actions">
							<button type="submit" class="btn btn-primary btn-large">Submit</button>
							<button type="reset" class="btn">Cancel</button>
						</div>
					</fieldset>
				</form>
			</div>
			<div class="col-4">
				<img class="citizen_avatar"
					src="http://s1.www.erepublik.net/images/modules/citizenprofile/profile_avatar.png"></img>
					<div class="list-group second">
					<a class="list-group-item active">  </a>

			</div>
		</div>
