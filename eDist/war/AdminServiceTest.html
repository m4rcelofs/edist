<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>eDist 0.1 - Exército Brasileiro</title>

<script type='text/javascript' src='/admin/dwr/engine.js'></script>
<script type='text/javascript'
	src='/admin/dwr/interface/AdminService.js'></script>

<script type='text/javascript' src='js/jquery-1.10.2.min.cache.js'></script>

<script type="text/javascript">
	function addTestPlayer(erId) {
		if (!erId) {
			erId = Math.floor(Math.random() * 100000000);
		}
		var player = {
			id : erId,
			status : 'NEW',
			rocketEnabled : 'Q3',
			config : {
				currentMaxDailyFF : 160,
				rocketAllowed : false,
				autoSend : false
			}
		};
		AdminService.addPlayer(player, {
			callback : function(response) {
				$('#test2').append('<br /> Player adicionado? ' + response);
			},
			errorHandler : errorHandlerFunction
		});
	}

	function listPlayers(cursor) {
		AdminService.listPlayers(cursor, {
			callback : function(response) {
				$('#test3').append(
						'<br/> Cursor para próximos resultados: '
								+ response.encodedCursor);
				response.results.forEach(function(item) {
					$('#test3').append('<br/>' + JSON.stringify(item));
				});

				$('#test3').append(
						'<br /><button onclick="listPlayers(\''
								+ response.encodedCursor
								+ '\')">Próxima página</button>');
			},
			errorHandler : errorHandlerFunction
		});
	}

	function saveDistributor(id) {
		var dist = {
			id : id,
			email : 'blabla@bla.com',
			password : '1234567890'
		};
		AdminService.saveDistributor(dist, {
			callback : function(response) {
				$('#test4').append('ok');
			},
			errorHandler : errorHandlerFunction
		});
	}

	function listDistributors() {
		AdminService.listDistributors({
			callback : function(response) {
				response.forEach(function(item) {
					$('#test4').append('<br/>' + JSON.stringify(item));
				});
			},
			errorHandler : errorHandlerFunction
		});
	}
	
	function saveGroup(id) {
		var group = {
			id : id,
			groupName: 'bla',
			config: {
				currentMaxDailyFF: 200,
				rocketAllowed: false,
				autoSend: false
			}
		};
		AdminService.saveGroup(group, {
			callback : function(response) {
				$('#test5').append('ok');
			},
			errorHandler : errorHandlerFunction
		});
	}

	function listGroups() {
		AdminService.listGroups({
			callback : function(response) {
				response.forEach(function(item) {
					$('#test5').append('<br/>' + JSON.stringify(item));
				});
			},
			errorHandler : errorHandlerFunction
		});
	}

	function errorHandlerFunction(message) {
		alert("Oops: " + message);
	}
</script>

</head>

<body onload="">
	<h1>Hello App Engine!</h1>
	<div id='install'>
		<a href='admin/install'>Instalar</a>
	</div>
	<div id='test'></div>
	<div id='test2'>
		<button onclick="addTestPlayer(5313713)">Adicionar player</button>
		<button onclick="addTestPlayer()">Adicionar player fake</button>
	</div>
	<div id='test3'>
		<button onclick="listPlayers('')">Listar players</button>
	</div>
	<div id='test4'>
		<button onclick="saveDistributor()">Adicionar distribuidor</button>
		<button onclick="listDistributors()">Listar distribuidores</button>
	</div>
	<div id='test5'>
		<button onclick="saveGroup()">Adicionar grupo</button>
		<button onclick="listGroups()">Listar grupos</button>
	</div>
</body>
</html>
