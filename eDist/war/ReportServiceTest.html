<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>eDist 0.1 - Exército Brasileiro</title>

<script type='text/javascript' src='/management/dwr/engine.js'></script>
<script type='text/javascript'
	src='/management/dwr/interface/ReportService.js'></script>


<script type='text/javascript' src='js/jquery-1.10.2.min.cache.js'></script>

<script type="text/javascript">
	function errorHandlerFunction(message) {
		alert("Oops: " + message);
	}

	function listRequests(cursor) {
		ReportService.listRequests(cursor, {
			callback : function(response) {
				$('#test1').append('<br/>' + JSON.stringify(response));
			},
			errorHandler : errorHandlerFunction
		});
	}

	function listRequestsByDate(cursor) {
		ReportService.listRequestsByDate(new Date(), cursor, {
			callback : function(response) {
				$('#test1').append('<br/>' + JSON.stringify(response));
			},
			errorHandler : errorHandlerFunction
		});
	}

	function listRequestsByPlayer(cursor) {
		var player = {
			id : 5313713
		};
		ReportService.listRequestsByPlayer(player, cursor, {
			callback : function(response) {
				$('#test1').append('<br/>' + JSON.stringify(response));
			},
			errorHandler : errorHandlerFunction
		});
	}

	function listRequestsByGroup(cursor) {
		var group = {
			id : 1
		};
		ReportService.listRequestsByGroup(group, cursor, {
			callback : function(response) {
				$('#test1').append('<br/>' + JSON.stringify(response));
			},
			errorHandler : errorHandlerFunction
		});
	}
</script>

</head>

<body onload="">
	<h1>Hello App Engine!</h1>
	<div id="test1">
		<button onclick="listRequests('')">listRequests(cursor)</button>
		<br/>
		<button onclick="listRequestsByDate('')">listRequestsByDate(cursor)</button>
		<br/>
		<button onclick="listRequestsByPlayer('')">listRequestsByPlayer(cursor)</button>
		<br/>
		<button onclick="listRequestsByGroup('')">listRequestsByGroup(cursor)</button>
	</div>
</body>
</html>
