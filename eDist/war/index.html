	function addTestPlayer(erId) {
		if (!erId) {
			erId = Math.floor(Math.random() * 100000000);
		}
		var player = {
			erId : '' + erId,
			status : 'NEW',
			currentMaxDailyFF : 160,
			rocketEnabled : null,
			autoSend : false
		};
		AdminService.add(player, {
			callback : function(response) {
				$('#test2').append('<br /> Player adicionado? ' + response);
			},
			errorHandler : errorHandlerFunction
		});
	}

	function listPlayers(cursor) {
		AdminService.listPlayers(cursor, {
			callback : function(response) {
				$('#test3').append(
						'<br/> Cursor para próximos resultados: '
								+ response.encodedCursor);
				response.results.forEach(function(item) {
					$('#test3').append('<br/>' + JSON.stringify(item));
				});

				$('#test3').append(
						'<br /><button onclick="listPlayers(\''
								+ response.encodedCursor
								+ '\')">Próxima página</button>');
			},
			errorHandler : errorHandlerFunction
		});
	}

	function errorHandlerFunction(message) {
		alert("Oops: " + message);
	}
</script>
